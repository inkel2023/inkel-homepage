<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>찾아오시는길 | 인켈로재</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, "Noto Sans KR", sans-serif;
      color: #222;
      background: #ffffff;
    }

    /* =========================
       상단 메인 메뉴
    ========================= */

    header {
      width: 100%;
      height: 90px;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4%;
    }

    .logo {
      display: block;
      cursor: pointer;
      text-decoration: none;
    }

    .logo img {
      display: block;
      width: 210px;
      height: auto;
    }

    .main-nav {
      display: flex;
      align-items: center;
      gap: 45px;
    }

    .main-nav a {
      color: #222;
      font-size: 16px;
      font-weight: 500;
      text-decoration: none;
    }

    .main-nav a:hover {
      color: #183b56;
    }

    /* =========================
       회사소개 타이틀
    ========================= */

    .company-header {
      width: 100%;
      background: #183b56;
      color: #ffffff;
      text-align: center;
      padding: 20px 20px 18px;
    }

    .company-header h1 {
      font-size: 38px;
      font-weight: 700;
    }

    /* =========================
       회사소개 하위 메뉴
    ========================= */

    .sub-nav {
      width: 100%;
      height: 58px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 55px;
      background: #ffffff;
      border-bottom: 1px solid #e5e5e5;
    }

    .sub-nav a {
      position: relative;
      display: flex;
      align-items: center;
      height: 58px;
      color: #333;
      font-size: 15px;
      font-weight: 500;
      text-decoration: none;
    }

    .sub-nav a:hover {
      color: #183b56;
    }

    .sub-nav a.active {
      color: #183b56;
      font-weight: 700;
    }

    .sub-nav a.active::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 3px;
      background: #183b56;
    }

    /* =========================
       찾아오시는길
    ========================= */

    .location-section {
      width: 100%;
      padding: 55px 20px 90px;
      background: #ffffff;
    }

    .section-title {
      width: min(1100px, 100%);
      margin: 0 auto 45px;
      text-align: center;
    }

    .section-title h2 {
      font-size: 34px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .section-title-line {
      width: 520px;
      max-width: 100%;
      height: 1px;
      margin: 0 auto;
      background: #dddddd;
    }

    /* =========================
       지도
    ========================= */

    .location-wrap {
      width: min(1100px, 100%);
      margin: 0 auto;
    }

    .map-box {
      width: 100%;
      height: 470px;
      overflow: hidden;
      border: 1px solid #e1e4e7;
      background: #f5f5f5;
    }

    .map-box iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* =========================
       회사 정보
    ========================= */

    .location-info {
      margin-top: 38px;
    }

    .company-name {
      margin-bottom: 20px;
      color: #183b56;
      font-size: 24px;
      font-weight: 700;
    }

    .info-row {
      display: grid;
      grid-template-columns: 130px 1fr;
      align-items: center;
      min-height: 58px;
      border-bottom: 1px solid #e5e5e5;
    }

    .info-row:first-of-type {
      border-top: 2px solid #183b56;
    }

    .info-label {
      color: #183b56;
      font-size: 15px;
      font-weight: 700;
    }

    .info-value {
      color: #333;
      font-size: 16px;
      font-weight: 400;
      line-height: 1.6;
      word-break: keep-all;
    }

    /* =========================
       하단
    ========================= */

    footer {
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #777;
      font-size: 12px;
      background: #ffffff;
    }

    /* =========================
       모바일
    ========================= */

    @media (max-width: 768px) {

      header {
        height: 70px;
        padding: 0 20px;
      }

      .logo img {
        width: 145px;
      }

      .main-nav {
        gap: 13px;
      }

      .main-nav a {
        font-size: 11px;
      }

      .company-header h1 {
        font-size: 29px;
      }

      .sub-nav {
        justify-content: flex-start;
        gap: 20px;
        padding: 0 15px;
        overflow-x: auto;
      }

      .sub-nav a {
        flex-shrink: 0;
        font-size: 12px;
      }

      .location-section {
        padding: 40px 15px 65px;
      }

      .section-title {
        margin-bottom: 35px;
      }

      .section-title h2 {
        font-size: 28px;
      }

      .map-box {
        height: 350px;
      }

      .location-info {
        margin-top: 28px;
      }

      .company-name {
        font-size: 21px;
      }

      .info-row {
        grid-template-columns: 90px 1fr;
        min-height: 55px;
      }

      .info-label {
        font-size: 13px;
      }

      .info-value {
        font-size: 14px;
      }
    }

  </style>
</head>
