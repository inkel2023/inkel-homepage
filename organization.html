<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>조직도 | 인켈로재</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, "Noto Sans KR", sans-serif;
      color: #222;
      background: #ffffff;
    }

    /* =========================
       상단 메인 메뉴
    ========================= */

    header {
      width: 100%;
      height: 90px;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4%;
    }

    .logo {
      display: block;
      cursor: pointer;
      text-decoration: none;
    }

    .logo img {
      display: block;
      width: 210px;
      height: auto;
    }

    .main-nav {
      display: flex;
      align-items: center;
      gap: 45px;
    }

    .main-nav a {
      color: #222;
      font-size: 16px;
      font-weight: 500;
      text-decoration: none;
    }

    .main-nav a:hover {
      color: #183b56;
    }

    /* =========================
       회사소개 타이틀
    ========================= */

    .company-header {
      width: 100%;
      background: #183b56;
      color: #ffffff;
      text-align: center;
      padding: 20px 20px 18px;
    }

    .company-header h1 {
      font-size: 38px;
      font-weight: 700;
    }

    /* =========================
       회사소개 하위 메뉴
    ========================= */

    .sub-nav {
      width: 100%;
      height: 58px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 55px;
background: #f4f7f9;
border-bottom: 1px solid #dce3e8;
    }

    .sub-nav a {
      position: relative;
      display: flex;
      align-items: center;
      height: 58px;
      color: #333;
      font-size: 15px;
      font-weight: 500;
      text-decoration: none;
    }

    .sub-nav a:hover {
      color: #183b56;
    }

    .sub-nav a.active {
      color: #183b56;
      font-weight: 700;
    }

    .sub-nav a.active::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 3px;
      background: #183b56;
    }

    /* =========================
       조직도 영역
    ========================= */

    .organization-section {
      width: 100%;
      padding: 55px 20px 90px;
      background: #ffffff;
    }

    .section-title {
      width: min(1100px, 100%);
      margin: 0 auto 45px;
      text-align: center;
    }

    .section-title h2 {
      font-size: 34px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .section-title-line {
      width: 520px;
      max-width: 100%;
      height: 1px;
      margin: 0 auto;
      background: #dddddd;
    }

    /* =========================
       조직도 이미지
    ========================= */

    .organization-content {
      width: min(1200px, 100%);
      margin: 0 auto;
      text-align: center;
    }

    .organization-image {
      display: block;
      width: 100%;
      max-width: 1200px;
      height: auto;
      margin: 0 auto;
    }

    /* =========================
       하단
    ========================= */

    footer {
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #777;
      font-size: 12px;
      background: #ffffff;
    }

    /* =========================
       모바일
    ========================= */

    @media (max-width: 768px) {

      header {
        height: 70px;
        padding: 0 20px;
      }

      .logo img {
        width: 145px;
      }

      .main-nav {
        gap: 13px;
      }

      .main-nav a {
        font-size: 11px;
      }

      .company-header h1 {
        font-size: 29px;
      }

      .sub-nav {
        justify-content: flex-start;
        gap: 20px;
        padding: 0 15px;
        overflow-x: auto;
      }

      .sub-nav a {
        flex-shrink: 0;
        font-size: 12px;
      }

      .organization-section {
        padding: 40px 10px 65px;
      }

      .section-title {
        margin-bottom: 35px;
      }

      .section-title h2 {
        font-size: 28px;
      }

      .organization-content {
        overflow-x: auto;
      }

      .organization-image {
        width: 800px;
        max-width: none;
      }
    }

  </style>
</head>

<body>

  <!-- 상단 메인 메뉴 -->
  <header>

    <a class="logo" href="./">
      <img src="logo-horizontal.png" alt="인켈로재 로고">
    </a>

    <nav class="main-nav">
      <a href="company.html">회사소개</a>
      <a href="safety-certificate.html">안전경영</a>
      <a href="pr-certificate.html">사업역량</a>
      <a href="contact.html">고객지원</a>
    </nav>

  </header>


  <!-- 회사소개 -->
  <section class="company-header">
    <h1>회사소개</h1>
  </section>


  <!-- 회사소개 하위 메뉴 -->
  <nav class="sub-nav">

    <a href="company.html">
      기업정보
    </a>

    <a href="greeting.html">
      임직원인사말
    </a>

    <a href="vision.html">
      비전목표
    </a>

    <a href="organization.html" class="active">
      조직도
    </a>

    <a href="location.html">
      찾아오시는길
    </a>

  </nav>


  <!-- 조직도 본문 -->
  <main>

    <section class="organization-section">

      <div class="section-title">
        <h2>조직도</h2>
        <div class="section-title-line"></div>
      </div>

      <div class="organization-content">
        <img
          class="organization-image"
          src="organization.png"
          alt="인켈로재 조직도"
        >
      </div>

    </section>

  </main>


  <!-- 하단 -->
  <footer>
    © INKEL FURNACE. All Rights Reserved.
  </footer>

</body>
</html>
