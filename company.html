<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>기업정보 | 인켈로재</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, "Noto Sans KR", sans-serif;
      color: #222;
      background: #ffffff;
    }

    /* =========================
       상단 메뉴
    ========================= */

    header {
      width: 100%;
      height: 90px;
      background: #ffffff;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 4%;
    }

    .logo {
      display: block;
      cursor: pointer;
      text-decoration: none;
    }

    .logo img {
      display: block;
      width: 210px;
      height: auto;
    }

    .main-nav {
      display: flex;
      align-items: center;
      gap: 45px;
    }

    .main-nav a {
      color: #222222;
      font-size: 16px;
      font-weight: 500;
      text-decoration: none;
    }

    .main-nav a:hover {
      color: #183b56;
    }


    /* =========================
       회사소개 제목
    ========================= */

    .company-header {
      width: 100%;
      background: #183b56;
      color: #ffffff;
      text-align: center;

      padding-top: 22px;
    }

    .company-header h1 {
      font-size: 38px;
      font-weight: 700;
      margin-bottom: 22px;
    }


    /* =========================
       회사소개 하위 메뉴
    ========================= */

    .sub-nav {
      width: 100%;
      min-height: 54px;

      display: flex;
      justify-content: center;
      align-items: center;
      gap: 55px;

      background: #ffffff;
      border-bottom: 1px solid #e5e5e5;
    }

    .sub-nav a {
      position: relative;

      display: flex;
      align-items: center;
      height: 54px;

      color: #333333;
      font-size: 15px;
      font-weight: 500;
      text-decoration: none;
    }

    .sub-nav a:hover {
      color: #183b56;
    }

    /* 현재 보고 있는 기업정보 메뉴 */
    .sub-nav a.active {
      color: #183b56;
      font-weight: 700;
    }

    .sub-nav a.active::after {
      content: "";

      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;

      height: 3px;
      background: #183b56;
    }


    /* =========================
       기업정보 본문
    ========================= */

    .company-info-section {
      width: 100%;
      padding: 55px 20px 90px;
      background: #ffffff;
    }

    .section-title {
      width: min(900px, 100%);
      margin: 0 auto 30px;
      text-align: center;
    }

    .section-title h2 {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .section-title-line {
      width: 100%;
      height: 1px;
      background: #dddddd;
    }


    /* =========================
       기업정보 이미지 영역
    ========================= */

    .company-info-box {
      position: relative;

      width: min(900px, 100%);
      min-height: 500px;

      margin: 0 auto;

      background-image: url("company-info-bg.png");
      background-size: cover;
      background-position: center;

      overflow: hidden;
    }

    /* 이미지 위 밝은 레이어 */
    .company-info-box::before {
      content: "";

      position: absolute;
      inset: 0;

      background: rgba(255, 255, 255, 0.72);
    }


    /* =========================
       기업정보 글자
    ========================= */

    .company-info-content {
      position: relative;
      z-index: 1;

      width: 100%;
      min-height: 500px;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 55px 70px;
    }

    .info-table {
      width: 100%;
      max-width: 650px;

      border-collapse: collapse;
    }

    .info-table th,
    .info-table td {
      padding: 11px 10px;

      vertical-align: top;

      font-size: 17px;
      line-height: 1.55;
    }

    .info-table th {
      width: 165px;

      text-align: right;

      padding-right: 30px;

      font-weight: 700;
      white-space: nowrap;
    }

    .info-table td {
      font-weight: 400;
    }


    /* =========================
       하단
    ========================= */

    footer {
      min-height: 70px;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;

      color: #777777;
      font-size: 12px;

      background: #ffffff;
    }


    /* =========================
       모바일
    ========================= */

    @media (max-width: 768px) {

      header {
        height: 70px;
        padding: 0 20px;
      }

      .logo img {
        width: 145px;
      }

      .main-nav {
        gap: 13px;
      }

      .main-nav a {
        font-size: 11px;
      }

      .company-header {
        padding-top: 20px;
      }

      .company-header h1 {
        font-size: 29px;
        margin-bottom: 18px;
      }

      .sub-nav {
        gap: 18px;
        padding: 0 15px;

        overflow-x: auto;

        justify-content: flex-start;
      }

      .sub-nav a {
        flex-shrink: 0;
        font-size: 12px;
      }

      .company-info-section {
        padding: 40px 15px 60px;
      }

      .section-title h2 {
        font-size: 27px;
      }

      .company-info-box {
        min-height: 460px;
      }

      .company-info-content {
        min-height: 460px;
        padding: 35px 20px;
      }

      .info-table th,
      .info-table td {
        font-size: 14px;
        padding: 9px 5px;
      }

      .info-table th {
        width: 105px;
        padding-right: 15px;
      }
    }

  </style>
</head>
