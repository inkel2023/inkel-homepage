<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>기업정보 | 인켈로재</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, "Noto Sans KR", sans-serif;
      color: #222;
      background: #ffffff;
    }

    /* =========================
       상단 메인 메뉴
    ========================= */

    header {
      width: 100%;
      height: 90px;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4%;
    }

    .logo {
      display: block;
      cursor: pointer;
      text-decoration: none;
    }

    .logo img {
      display: block;
      width: 210px;
      height: auto;
    }

    .main-nav {
      display: flex;
      align-items: center;
      gap: 45px;
    }

    .main-nav a {
      color: #222;
      font-size: 16px;
      font-weight: 500;
      text-decoration: none;
    }

    .main-nav a:hover {
      color: #183b56;
    }

    /* =========================
       회사소개 타이틀
    ========================= */

    .company-header {
      width: 100%;
      background: #183b56;
      color: #ffffff;
      text-align: center;
      padding: 20px 20px 18px;
    }

    .company-header h1 {
      font-size: 38px;
      font-weight: 700;
    }

    /* =========================
       하위 메뉴
    ========================= */

    .sub-nav {
      width: 100%;
      height: 58px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 55px;
      background: #ffffff;
      border-bottom: 1px solid #e5e5e5;
    }

    .sub-nav a {
      position: relative;
      display: flex;
      align-items: center;
      height: 58px;
      color: #333;
      font-size: 15px;
      font-weight: 500;
      text-decoration: none;
    }

    .sub-nav a:hover {
      color: #183b56;
    }

    .sub-nav a.active {
      color: #183b56;
      font-weight: 700;
    }

    .sub-nav a.active::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 3px;
      background: #183b56;
    }

    /* =========================
       기업정보 섹션
    ========================= */

    .company-info-section {
      width: 100%;
      padding: 55px 20px 85px;
      background: #ffffff;
    }

    .section-title {
      width: min(1100px, 100%);
      margin: 0 auto 28px;
      text-align: center;
    }

    .section-title h2 {
      font-size: 34px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .section-title-line {
      width: 520px;
      max-width: 100%;
      height: 1px;
      margin: 0 auto;
      background: #dddddd;
    }

    /* =========================
       배경 이미지 + 정보
    ========================= */

    .company-info-wrap {
      position: relative;
      width: min(1250px, 100%);
      min-height: 590px;
      margin: 0 auto;

      background-image: url("company-info-bg2.png");
      background-size: cover;
      background-position: left center;
      background-repeat: no-repeat;
    }

    .company-info-content {
      position: absolute;
      top: 50%;
      right: 7%;
      transform: translateY(-50%);

      width: 48%;
      max-width: 590px;
    }

    .info-row {
      display: grid;
      grid-template-columns: 175px 1fr;
      align-items: start;

      padding: 15px 0;
      border-bottom: 1px solid #e6e6e6;
    }

    .info-row:last-child {
      border-bottom: none;
    }

    .info-label {
      color: #183b56;
      font-size: 17px;
      font-weight: 700;
      white-space: nowrap;
    }

    .info-value {
      color: #222;
      font-size: 17px;
      font-weight: 400;
      line-height: 1.65;
      word-break: keep-all;
    }

    /* =========================
       하단
    ========================= */

    footer {
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #777;
      font-size: 12px;
      background: #ffffff;
    }

    /* =========================
       모바일
    ========================= */

    @media (max-width: 768px) {

      header {
        height: 70px;
        padding: 0 20px;
      }

      .logo img {
        width: 145px;
      }

      .main-nav {
        gap: 13px;
      }

      .main-nav a {
        font-size: 11px;
      }

      .company-header h1 {
        font-size: 29px;
      }

      .sub-nav {
        justify-content: flex-start;
        gap: 20px;
        padding: 0 15px;
        overflow-x: auto;
      }

      .sub-nav a {
        flex-shrink: 0;
        font-size: 12px;
      }

      .company-info-section {
        padding: 40px 15px 60px;
      }

      .section-title h2 {
        font-size: 28px;
      }

      .company-info-wrap {
        min-height: 720px;
        background-size: auto 100%;
        background-position: left top;
      }

      .company-info-content {
        position: absolute;
        left: 20px;
        right: 20px;
        top: auto;
        bottom: 25px;
        transform: none;

        width: auto;
        max-width: none;

        padding: 22px;
        background: rgba(255, 255, 255, 0.94);
      }

      .info-row {
        grid-template-columns: 110px 1fr;
        padding: 10px 0;
      }

      .info-label,
      .info-value {
        font-size: 14px;
      }
    }

  </style>
</head>
