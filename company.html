<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>기업정보 | 인켈로재</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, "Noto Sans KR", sans-serif;
      color: #222;
      background: #ffffff;
    }

    /* =========================
       상단 메뉴
    ========================= */

    header {
      width: 100%;
      height: 90px;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4%;
    }

    .logo {
      display: block;
      cursor: pointer;
      text-decoration: none;
    }

    .logo img {
      display: block;
      width: 210px;
      height: auto;
    }

    .main-nav {
      display: flex;
      align-items: center;
      gap: 45px;
    }

    .main-nav a {
      color: #222;
      font-size: 16px;
      font-weight: 500;
      text-decoration: none;
    }

    .main-nav a:hover {
      color: #183b56;
    }

    /* =========================
       회사소개 제목
    ========================= */

    .company-header {
      width: 100%;
      background: #183b56;
      color: #ffffff;
      text-align: center;
      padding-top: 22px;
    }

    .company-header h1 {
      font-size: 38px;
      font-weight: 700;
      margin-bottom: 22px;
    }

    /* =========================
       회사소개 하위 메뉴
    ========================= */

    .sub-nav {
      width: 100%;
      min-height: 54px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 55px;
      background: #ffffff;
      border-bottom: 1px solid #e5e5e5;
    }

    .sub-nav a {
      position: relative;
      display: flex;
      align-items: center;
      height: 54px;
      color: #333;
      font-size: 15px;
      font-weight: 500;
      text-decoration: none;
    }

    .sub-nav a:hover {
      color: #183b56;
    }

    .sub-nav a.active {
      color: #183b56;
      font-weight: 700;
    }

    .sub-nav a.active::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 3px;
      background: #183b56;
    }

    /* =========================
       기업정보 본문
    ========================= */

    .company-info-section {
      width: 100%;
      padding: 55px 20px 90px;
      background: #ffffff;
    }

    .section-title {
      width: min(1100px, 100%);
      margin: 0 auto 30px;
      text-align: center;
    }

    .section-title h2 {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .section-title-line {
      width: 100%;
      height: 1px;
      background: #dddddd;
    }

    /* =========================
       기업정보 카드
    ========================= */

    .company-info-card {
      width: min(1100px, 100%);
      min-height: 500px;
      margin: 0 auto;

      display: grid;
      grid-template-columns: 1.05fr 0.95fr;

      border: 1px solid #e3e3e3;
      background: #ffffff;
      overflow: hidden;
    }

    /* 왼쪽 이미지 */
    .company-info-image {
      min-height: 500px;
      background-image: url("company-info-bg.png");
      background-size: cover;
      background-position: left center;
    }

    /* 오른쪽 정보 */
    .company-info-content {
      min-height: 500px;

      display: flex;
      align-items: center;

      padding: 50px 55px;

      background: rgba(255, 255, 255, 0.98);
    }

    .info-table {
      width: 100%;
      border-collapse: collapse;
    }

    .info-table th,
    .info-table td {
      padding: 12px 0;
      vertical-align: top;
      font-size: 17px;
      line-height: 1.6;
    }

    .info-table th {
      width: 145px;
      padding-right: 25px;
      text-align: left;
      font-weight: 700;
      color: #183b56;
      white-space: nowrap;
    }

    .info-table td {
      color: #333;
      font-weight: 400;
    }

    /* =========================
       하단
    ========================= */

    footer {
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #777;
      font-size: 12px;
      background: #ffffff;
    }

    /* =========================
       모바일
    ========================= */

    @media (max-width: 768px) {

      header {
        height: 70px;
        padding: 0 20px;
      }

      .logo img {
        width: 145px;
      }

      .main-nav {
        gap: 13px;
      }

      .main-nav a {
        font-size: 11px;
      }

      .company-header {
        padding-top: 20px;
      }

      .company-header h1 {
        font-size: 29px;
        margin-bottom: 18px;
      }

      .sub-nav {
        gap: 18px;
        padding: 0 15px;
        overflow-x: auto;
        justify-content: flex-start;
      }

      .sub-nav a {
        flex-shrink: 0;
        font-size: 12px;
      }

      .company-info-section {
        padding: 40px 15px 60px;
      }

      .section-title h2 {
        font-size: 27px;
      }

      .company-info-card {
        grid-template-columns: 1fr;
      }

      .company-info-image {
        min-height: 280px;
        background-position: left center;
      }

      .company-info-content {
        min-height: auto;
        padding: 30px 25px;
      }

      .info-table th,
      .info-table td {
        font-size: 14px;
        padding: 9px 0;
      }

      .info-table th {
        width: 105px;
        padding-right: 15px;
      }
    }

  </style>
</head>
