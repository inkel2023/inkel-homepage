<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>현장사진 | 인켈로재</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, "Noto Sans KR", sans-serif;
      color: #222;
      background: #ffffff;
    }

    /* =========================
       상단 메인 메뉴
    ========================= */

    header {
      width: 100%;
      height: 90px;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4%;
    }

    .logo {
      display: block;
      cursor: pointer;
      text-decoration: none;
    }

    .logo img {
      display: block;
      width: 210px;
      height: auto;
    }

    .main-nav {
      display: flex;
      align-items: center;
      gap: 45px;
    }

    .main-nav a {
      color: #222;
      font-size: 16px;
      font-weight: 500;
      text-decoration: none;
    }

    .main-nav a:hover {
      color: #183b56;
    }

    /* =========================
       사업역량 타이틀
    ========================= */

    .business-header {
      width: 100%;
      background: #183b56;
      color: #ffffff;
      text-align: center;
      padding: 20px 20px 18px;
    }

    .business-header h1 {
      font-size: 38px;
      font-weight: 700;
    }

    /* =========================
       사업역량 하위 메뉴
    ========================= */

    .sub-nav {
      width: 100%;
      height: 58px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 55px;
      background: #f4f7f9;
      border-bottom: 1px solid #dce3e8;
    }

    .sub-nav a {
      position: relative;
      display: flex;
      align-items: center;
      height: 58px;
      color: #333;
      font-size: 15px;
      font-weight: 500;
      text-decoration: none;
    }

    .sub-nav a:hover {
      color: #183b56;
    }

    .sub-nav a.active {
      color: #183b56;
      font-weight: 700;
    }

    .sub-nav a.active::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 3px;
      background: #183b56;
    }

    /* =========================
       현장사진 본문
    ========================= */

    .gallery-section {
      width: 100%;
      padding: 55px 30px 90px;
      background: #ffffff;
    }

    .section-title {
      width: min(1200px, 100%);
      margin: 0 auto 45px;
      text-align: center;
    }

    .section-title h2 {
      font-size: 34px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .section-title-line {
      width: 520px;
      max-width: 100%;
      height: 1px;
      margin: 0 auto;
      background: #dddddd;
    }

    /* =========================
       갤러리
    ========================= */

    .gallery-grid {
      width: min(1400px, 100%);
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 24px 18px;
    }

    .gallery-card {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      overflow: hidden;
      background: #eeeeee;
      cursor: pointer;
    }

    .gallery-card img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.35s ease;
    }

    .gallery-card:hover img {
      transform: scale(1.04);
    }

    .gallery-info {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 35px 12px 11px;
      color: #ffffff;
      background: linear-gradient(
        to top,
        rgba(0, 0, 0, 0.78),
        rgba(0, 0, 0, 0)
      );
    }

    .gallery-info strong {
      display: block;
      margin-bottom: 3px;
      font-size: 14px;
      font-weight: 700;
    }

    .gallery-info span {
      display: block;
      font-size: 12px;
      line-height: 1.4;
      font-weight: 400;
    }

    /* =========================
       사진 확대
    ========================= */

    .modal {
      display: none;
      position: fixed;
      z-index: 9999;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.82);
      align-items: center;
      justify-content: center;
      padding: 30px;
    }

    .modal.active {
      display: flex;
    }

    .modal img {
      display: block;
      max-width: 92vw;
      max-height: 88vh;
      width: auto;
      height: auto;
      object-fit: contain;
    }

    .modal-close {
      position: absolute;
      top: 22px;
      right: 30px;
      color: #ffffff;
      font-size: 38px;
      font-weight: 300;
      cursor: pointer;
      user-select: none;
    }

    /* =========================
       하단
    ========================= */

    footer {
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #777;
      font-size: 12px;
      background: #ffffff;
    }

    /* =========================
       태블릿
    ========================= */

    @media (max-width: 1100px) {
      .gallery-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    /* =========================
       모바일
    ========================= */

    @media (max-width: 768px) {

      header {
        height: 70px;
        padding: 0 20px;
      }

      .logo img {
        width: 145px;
      }

      .main-nav {
        gap: 13px;
      }

      .main-nav a {
        font-size: 11px;
      }

      .business-header h1 {
        font-size: 29px;
      }

      .sub-nav {
        justify-content: flex-start;
        gap: 35px;
        padding: 0 20px;
        overflow-x: auto;
        white-space: nowrap;
      }

      .sub-nav a {
        flex: 0 0 auto;
        font-size: 13px;
      }

      .gallery-section {
        padding: 40px 15px 65px;
      }

      .section-title {
        margin-bottom: 35px;
      }

      .section-title h2 {
        font-size: 28px;
      }

      .gallery-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }

      .gallery-info {
        padding: 30px 9px 8px;
      }

      .gallery-info strong {
        font-size: 12px;
      }

      .gallery-info span {
        font-size: 10px;
      }

      .modal {
        padding: 15px;
      }

      .modal-close {
        top: 12px;
        right: 18px;
        font-size: 34px;
      }
    }

  </style>
</head>

<body>

  <!-- 상단 메인 메뉴 -->
  <header>

    <a class="logo" href="./">
      <img src="logo-horizontal.png" alt="인켈로재 로고">
    </a>

    <nav class="main-nav">
      <a href="company.html">회사소개</a>
      <a href="safety-certificate.html">안전경영</a>
      <a href="pr-certificate.html">사업역량</a>
      <a href="contact.html">고객지원</a>
    </nav>

  </header>


  <!-- 사업역량 -->
  <section class="business-header">
    <h1>사업역량</h1>
  </section>


  <!-- 사업역량 하위 메뉴 -->
  <nav class="sub-nav">

    <a href="pr-certificate.html">
      인증서
    </a>

    <a href="projects.html">
      공사실적
    </a>

    <a href="equipment.html">
      장비보유현황
    </a>

    <a href="gallery.html" class="active">
      현장사진
    </a>

  </nav>


  <!-- 현장사진 -->
  <main>

    <section class="gallery-section">

      <div class="section-title">
        <h2>현장사진</h2>
        <div class="section-title-line"></div>
      </div>


      <div class="gallery-grid">

        <!-- 사진 01 -->
        <div class="gallery-card"
             onclick="openModal('images/gallery/gallery-01.jpg')">

          <img
            src="images/gallery/gallery-01.jpg"
            alt="현장사진 1"
            loading="lazy"
          >

          <div class="gallery-info">
            <strong>에스오일</strong>
            <span>안전한지게차작업</span>
          </div>

        </div>


        <!-- 사진 02 -->
        <div class="gallery-card"
             onclick="openModal('images/gallery/gallery-02.jpg')">

          <img
            src="images/gallery/gallery-02.jpg"
            alt="현장사진 2"
            loading="lazy"
          >

          <div class="gallery-info">
            <strong>에스오일</strong>
            <span>작업내용을예시로</span>
          </div>

        </div>


        <!-- 사진 03 -->
        <div class="gallery-card"
             onclick="openModal('images/gallery/gallery-03.jpg')">

          <img
            src="images/gallery/gallery-03.jpg"
            alt="현장사진 3"
            loading="lazy"
          >

          <div class="gallery-info">
            <strong>오예스오일</strong>
            <span>직접내용을적을수있어요</span>
          </div>

        </div>


        <!-- 사진 04 -->
        <div class="gallery-card"
             onclick="openModal('images/gallery/gallery-04.jpg')">

          <img
            src="images/gallery/gallery-04.jpg"
            alt="현장사진 4"
            loading="lazy"
          >

          <div class="gallery-info">
            <strong>5장까지들어가고</strong>
            <span>6장부턴 다음열로 </span>
          </div>

        </div>

      </div>

    </section>

  </main>


  <!-- 사진 확대창 -->
  <div class="modal" id="imageModal" onclick="closeModal(event)">

    <span class="modal-close" onclick="closeModalButton()">
      &times;
    </span>

    <img id="modalImage" src="" alt="확대된 현장사진">

  </div>


  <footer>
    © INKEL FURNACE. All Rights Reserved.
  </footer>


  <script>

    function openModal(imageSrc) {
      const modal = document.getElementById("imageModal");
      const modalImage = document.getElementById("modalImage");

      modalImage.src = imageSrc;
      modal.classList.add("active");
      document.body.style.overflow = "hidden";
    }

    function closeModal(event) {
      if (event.target.id === "imageModal") {
        const modal = document.getElementById("imageModal");

        modal.classList.remove("active");
        document.body.style.overflow = "";
      }
    }

    function closeModalButton() {
      const modal = document.getElementById("imageModal");

      modal.classList.remove("active");
      document.body.style.overflow = "";
    }

    document.addEventListener("keydown", function(event) {
      if (event.key === "Escape") {
        closeModalButton();
      }
    });

  </script>

</body>
</html>
