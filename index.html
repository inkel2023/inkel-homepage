<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>인켈로재</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, "Noto Sans KR", sans-serif;
      background: #ffffff;
    }

    /* =========================
       상단 메뉴
    ========================= */

    header {
      width: 100%;
      height: 90px;
      background: #ffffff;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 4%;
    }

    .logo {
      display: block;
      cursor: pointer;
      text-decoration: none;
    }

    .logo img {
      display: block;
      width: 210px;
      height: auto;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 45px;
    }

    nav a {
      color: #222222;
      font-size: 16px;
      font-weight: 500;
      text-decoration: none;
    }

    nav a:hover {
      color: #183b56;
    }

    /* =========================
       메인 이미지
    ========================= */

    .hero {
      position: relative;
      width: 100%;
      overflow: hidden;
      background: #102a70;
    }

    .hero img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* 추가 문구 */
    .hero-subtext {
      position: absolute;

      /* 위치 조절 */
      left: 50%;
      top: 64%;
      transform: translateX(-50%);

      width: 90%;
      text-align: center;

      color: #ffffff;
      font-size: 17px;
      font-weight: 400;
      letter-spacing: 1px;

      text-shadow: 0 1px 5px rgba(0, 0, 0, 0.35);
    }

    /* =========================
       하단
    ========================= */

    footer {
      height: 70px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #ffffff;

      color: #777777;
      font-size: 12px;
    }

    /* =========================
       모바일
    ========================= */

    @media (max-width: 768px) {

      header {
        height: 70px;
        padding: 0 20px;
      }

      .logo img {
        width: 140px;
      }

      nav {
        gap: 15px;
      }

      nav a {
        font-size: 12px;
      }

      .hero-subtext {
        top: 66%;
        width: 92%;
        padding: 0 10px;

        font-size: 11px;
        line-height: 1.6;
        letter-spacing: 0.3px;
      }

      footer {
        height: 55px;
      }
    }

  </style>
</head>

<body>

  <!-- 상단 메뉴 -->
  <header>

    <a class="logo" href="./">
      <img src="logo-horizontal.png" alt="인켈로재 로고">
    </a>

    <nav>
      <a href="company.html">회사소개</a>
      <a href="safety-certificate.html">안전경영</a>
      <a href="pr-certificate.html">사업역량</a>
      <a href="contact.html">고객지원</a>
    </nav>

  </header>


  <!-- 메인 -->
  <main>

    <div class="hero">

      <img src="main.png" alt="인켈로재">

      <div class="hero-subtext">
        제철화학 · 석유화학 · 발전소 · 소각로 · 내화물 해체 · 시공 · SV
      </div>

    </div>

  </main>


  <!-- 하단 -->
  <footer>
    © INKEL FURNACE. All Rights Reserved.
  </footer>

</body>
</html>
