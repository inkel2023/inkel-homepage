<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>비전목표 | 인켈로재</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, "Noto Sans KR", sans-serif;
      color: #222;
      background: #ffffff;
    }

    /* =========================
       상단 메인 메뉴
    ========================= */

    header {
      width: 100%;
      height: 90px;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4%;
    }

    .logo {
      display: block;
      cursor: pointer;
      text-decoration: none;
    }

    .logo img {
      display: block;
      width: 210px;
      height: auto;
    }

    .main-nav {
      display: flex;
      align-items: center;
      gap: 45px;
    }

    .main-nav a {
      color: #222;
      font-size: 16px;
      font-weight: 500;
      text-decoration: none;
    }

    .main-nav a:hover {
      color: #183b56;
    }

    /* =========================
       회사소개 타이틀
    ========================= */

    .company-header {
      width: 100%;
      background: #183b56;
      color: #ffffff;
      text-align: center;
      padding: 20px 20px 18px;
    }

    .company-header h1 {
      font-size: 38px;
      font-weight: 700;
    }

    /* =========================
       회사소개 하위 메뉴
    ========================= */

    .sub-nav {
  width: 100%;
  height: 58px;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 55px;
  background: #f4f7f9;
  border-bottom: 1px solid #dce3e8;
}

    .sub-nav a {
      position: relative;
      display: flex;
      align-items: center;
      height: 58px;
      color: #333;
      font-size: 15px;
      font-weight: 500;
      text-decoration: none;
    }

    .sub-nav a:hover {
      color: #183b56;
    }

    .sub-nav a.active {
      color: #183b56;
      font-weight: 700;
    }

    .sub-nav a.active::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 3px;
      background: #183b56;
    }

    /* =========================
       비전목표 본문
    ========================= */

    .vision-section {
      width: 100%;
      padding: 45px 20px 80px;
      background: #ffffff;
    }

    /* =========================
       제목
    ========================= */

    .section-title {
      width: min(1100px, 100%);
      margin: 0 auto 40px;
      text-align: center;
    }

    .section-title h2 {
      font-size: 34px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .section-title-line {
      width: 520px;
      max-width: 100%;
      height: 1px;
      margin: 0 auto;
      background: #dddddd;
    }

    /* =========================
       비전 이미지
    ========================= */

    .vision-content {
      width: min(1000px, 100%);
      margin: 0 auto;
      text-align: center;
    }

    .vision-image {
      display: block;
      width: 100%;
      max-width: 1000px;
      height: auto;
      margin: 0 auto;
    }

    /* =========================
       슬로건
    ========================= */

    .vision-slogan {
      width: min(900px, 90%);
      margin: 35px auto 0;
      padding: 15px 25px;

      background: #4f73a8;
      color: #ffffff;

      font-size: 16px;
      font-weight: 500;
      text-align: center;
      letter-spacing: 0.3px;
    }

    /* =========================
       하단
    ========================= */

    footer {
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #777;
      font-size: 12px;
      background: #ffffff;
    }

    /* =========================
       모바일
    ========================= */

    @media (max-width: 768px) {

      header {
        height: 70px;
        padding: 0 20px;
      }

      .logo img {
        width: 145px;
      }

      .main-nav {
        gap: 13px;
      }

      .main-nav a {
        font-size: 11px;
      }

      .company-header {
        padding: 18px 15px 16px;
      }

      .company-header h1 {
        font-size: 29px;
      }

      .sub-nav {
        justify-content: flex-start;
        gap: 20px;
        padding: 0 15px;
        overflow-x: auto;
      }

      .sub-nav a {
        flex-shrink: 0;
        font-size: 12px;
      }

      .vision-section {
        padding: 35px 15px 55px;
      }

      .section-title {
        margin-bottom: 30px;
      }

      .section-title h2 {
        font-size: 28px;
      }

      .vision-content {
        width: 100%;
        overflow-x: auto;
      }

      .vision-image {
        width: 850px;
        max-width: none;
      }

      .vision-slogan {
        width: 100%;
        margin-top: 25px;
        padding: 13px 15px;
        font-size: 13px;
      }
    }

  </style>
</head>

<body>

  <!-- 상단 메인 메뉴 -->
  <header>

    <a class="logo" href="./">
      <img src="logo-horizontal.png" alt="인켈로재 로고">
    </a>

    <nav class="main-nav">
      <a href="company.html">회사소개</a>
      <a href="safety-certificate.html">안전경영</a>
      <a href="pr-certificate.html">사업역량</a>
      <a href="contact.html">고객지원</a>
    </nav>

  </header>


  <!-- 회사소개 -->
  <section class="company-header">
    <h1>회사소개</h1>
  </section>


  <!-- 회사소개 하위 메뉴 -->
  <nav class="sub-nav">

    <a href="company.html">
      기업정보
    </a>

    <a href="greeting.html">
      임직원인사말
    </a>

    <a href="vision.html" class="active">
      비전목표
    </a>

    <a href="organization.html">
      조직도
    </a>


  </nav>


  <!-- 비전목표 -->
  <main>

    <section class="vision-section">

      <div class="section-title">

        <h2>비전목표</h2>

        <div class="section-title-line"></div>

      </div>


      <div class="vision-content">

        <!-- 새로 올린 이미지 -->
        <img
          class="vision-image"
          src="vision2.png"
          alt="인켈로재 비전목표"
        >


        <!-- 슬로건 -->
        <div class="vision-slogan">
          기술을 쌓고, 신뢰를 만들고, 미래를 연다
        </div>

      </div>

    </section>

  </main>


  <!-- 하단 -->
  <footer>
    © INKEL FURNACE. All Rights Reserved.
  </footer>

</body>
</html>
