<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>인증서 | 인켈로재</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, "Noto Sans KR", sans-serif;
      color: #222;
      background: #ffffff;
    }

    /* =========================
       상단 메인 메뉴
    ========================= */

    header {
      width: 100%;
      height: 90px;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4%;
    }

    .logo {
      display: block;
      text-decoration: none;
      cursor: pointer;
    }

    .logo img {
      display: block;
      width: 210px;
      height: auto;
    }

    .main-nav {
      display: flex;
      align-items: center;
      gap: 45px;
    }

    .main-nav a {
      color: #222;
      font-size: 16px;
      font-weight: 500;
      text-decoration: none;
    }

    .main-nav a:hover {
      color: #183b56;
    }

    /* =========================
       안전경영 타이틀
    ========================= */

    .safety-header {
      width: 100%;
      background: #183b56;
      color: #ffffff;
      text-align: center;
      padding: 20px 20px 18px;
    }

    .safety-header h1 {
      font-size: 38px;
      font-weight: 700;
    }

    /* =========================
       안전경영 하위메뉴
    ========================= */

    .sub-nav {
      width: 100%;
      height: 58px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 85px;
      background: #ffffff;
      border-bottom: 1px solid #e5e5e5;
    }

    .sub-nav a {
      position: relative;
      display: flex;
      align-items: center;
      height: 58px;

      color: #333;
      font-size: 15px;
      font-weight: 500;
      text-decoration: none;
    }

    .sub-nav a:hover {
      color: #183b56;
    }

    .sub-nav a.active {
      color: #183b56;
      font-weight: 700;
    }

    .sub-nav a.active::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;

      height: 3px;
      background: #183b56;
    }

    /* =========================
       인증서 영역
    ========================= */

    .certificate-section {
      width: 100%;
      padding: 55px 20px 100px;
      background: #ffffff;
    }

    .section-title {
      width: min(1100px, 100%);
      margin: 0 auto 55px;
      text-align: center;
    }

    .section-title h2 {
      font-size: 34px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .section-title-line {
      width: 520px;
      max-width: 100%;
      height: 1px;
      margin: 0 auto;
      background: #dddddd;
    }

    /* =========================
       인증서 3개
    ========================= */

    .certificate-grid {
      width: min(1200px, 100%);
      margin: 0 auto;

      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 35px;

      align-items: start;
    }

    .certificate-item {
      text-align: center;
    }

    .certificate-image-wrap {
      width: 100%;
      overflow: hidden;
      background: #ffffff;
      border: 1px solid #d5dbe0;

      cursor: zoom-in;

      transition:
        transform 0.25s ease,
        box-shadow 0.25s ease;
    }

    .certificate-image-wrap:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.12);
    }

    .certificate-image {
      display: block;
      width: 100%;
      height: auto;
    }

    .certificate-name {
      margin-top: 18px;
      color: #183b56;
      font-size: 17px;
      font-weight: 700;
    }

    .certificate-desc {
      margin-top: 6px;
      color: #777;
      font-size: 13px;
    }

    /* =========================
       이미지 확대창
    ========================= */

    .image-modal {
      display: none;

      position: fixed;
      z-index: 9999;

      left: 0;
      top: 0;

      width: 100%;
      height: 100%;

      padding: 35px;

      background: rgba(0, 0, 0, 0.82);

      align-items: center;
      justify-content: center;
    }

    .image-modal.show {
      display: flex;
    }

    .modal-image {
      display: block;

      max-width: 90%;
      max-height: 92vh;

      width: auto;
      height: auto;

      background: #ffffff;

      box-shadow: 0 10px 50px rgba(0, 0, 0, 0.4);
    }

    .modal-close {
      position: fixed;
      top: 20px;
      right: 30px;

      width: 45px;
      height: 45px;

      border: none;
      background: transparent;

      color: #ffffff;
      font-size: 42px;
      font-weight: 300;
      line-height: 1;

      cursor: pointer;
    }

    /* =========================
       하단
    ========================= */

    footer {
      min-height: 70px;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;

      color: #777;
      font-size: 12px;

      background: #ffffff;
    }

    /* =========================
       모바일
    ========================= */

    @media (max-width: 768px) {

      header {
        height: 70px;
        padding: 0 20px;
      }

      .logo img {
        width: 145px;
      }

      .main-nav {
        gap: 13px;
      }

      .main-nav a {
        font-size: 11px;
      }

      .safety-header h1 {
        font-size: 29px;
      }

      .sub-nav {
        gap: 55px;
      }

      .sub-nav a {
        font-size: 13px;
      }

      .certificate-section {
        padding: 40px 20px 70px;
      }

      .section-title {
        margin-bottom: 40px;
      }

      .section-title h2 {
        font-size: 28px;
      }

      .certificate-grid {
        grid-template-columns: 1fr;
        gap: 45px;

        max-width: 420px;
      }

      .certificate-name {
        font-size: 16px;
      }

      .image-modal {
        padding: 15px;
      }

      .modal-image {
        max-width: 96%;
        max-height: 90vh;
      }

      .modal-close {
        top: 10px;
        right: 15px;
      }
    }

  </style>
</head>


<body>

  <!-- 상단 메인 메뉴 -->
  <header>

    <a class="logo" href="./">
      <img src="logo-horizontal.png" alt="인켈로재 로고">
    </a>

    <nav class="main-nav">
      <a href="company.html">회사소개</a>
      <a href="safety-certificate.html">안전경영</a>
      <a href="pr-certificate.html">홍보센터</a>
      <a href="contact.html">고객지원</a>
    </nav>

  </header>


  <!-- 안전경영 -->
  <section class="safety-header">
    <h1>안전경영</h1>
  </section>


  <!-- 안전경영 하위메뉴 -->
  <nav class="sub-nav">

    <a href="safety-certificate.html" class="active">
      인증서
    </a>

    <a href="safety-strategy.html">
      전략
    </a>

  </nav>


  <!-- 인증서 본문 -->
  <main>

    <section class="certificate-section">

      <div class="section-title">
        <h2>인증서</h2>
        <div class="section-title-line"></div>
      </div>


      <div class="certificate-grid">

        <!-- ISO 14001 -->
        <div class="certificate-item">

          <div
            class="certificate-image-wrap"
            onclick="openImage('iso14001.png')"
          >
            <img
              class="certificate-image"
              src="iso14001.png"
              alt="ISO 14001 환경경영시스템 인증서"
            >
          </div>

          <div class="certificate-name">
            ISO 14001
          </div>

          <div class="certificate-desc">
            환경경영시스템
          </div>

        </div>


        <!-- ISO 45001 -->
        <div class="certificate-item">

          <div
            class="certificate-image-wrap"
            onclick="openImage('iso45001.png')"
          >
            <img
              class="certificate-image"
              src="iso45001.png"
              alt="ISO 45001 안전보건경영시스템 인증서"
            >
          </div>

          <div class="certificate-name">
            ISO 45001
          </div>

          <div class="certificate-desc">
            안전보건경영시스템
          </div>

        </div>


        <!-- ISO 9001 -->
        <div class="certificate-item">

          <div
            class="certificate-image-wrap"
            onclick="openImage('iso9001.png')"
          >
            <img
              class="certificate-image"
              src="iso9001.png"
              alt="ISO 9001 품질경영시스템 인증서"
            >
          </div>

          <div class="certificate-name">
            ISO 9001
          </div>

          <div class="certificate-desc">
            품질경영시스템
          </div>

        </div>

      </div>

    </section>

  </main>


  <!-- 인증서 확대창 -->
  <div
    id="imageModal"
    class="image-modal"
    onclick="closeImage(event)"
  >

    <button
      class="modal-close"
      onclick="closeModal()"
      aria-label="닫기"
    >
      ×
    </button>

    <img
      id="modalImage"
      class="modal-image"
      src=""
      alt="인증서 확대 이미지"
    >

  </div>


  <!-- 하단 -->
  <footer>
    © INKEL FURNACE. All Rights Reserved.
  </footer>


  <script>

    function openImage(imageSrc) {
      const modal = document.getElementById("imageModal");
      const modalImage = document.getElementById("modalImage");

      modalImage.src = imageSrc;
      modal.classList.add("show");

      document.body.style.overflow = "hidden";
    }


    function closeModal() {
      const modal = document.getElementById("imageModal");

      modal.classList.remove("show");

      document.body.style.overflow = "";
    }


    function closeImage(event) {

      if (event.target.id === "imageModal") {
        closeModal();
      }

    }


    document.addEventListener("keydown", function(event) {

      if (event.key === "Escape") {
        closeModal();
      }

    });

  </script>

</body>
</html>
