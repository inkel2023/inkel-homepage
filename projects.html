<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>공사실적 | 인켈로재</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, "Noto Sans KR", sans-serif;
      color: #222;
      background: #ffffff;
    }

    header {
      width: 100%;
      height: 90px;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4%;
    }

    .logo {
      display: block;
      text-decoration: none;
    }

    .logo img {
      display: block;
      width: 210px;
      height: auto;
    }

    .main-nav {
      display: flex;
      align-items: center;
      gap: 45px;
    }

    .main-nav a {
      color: #222;
      font-size: 16px;
      font-weight: 500;
      text-decoration: none;
    }

    .main-nav a:hover {
      color: #183b56;
    }

    .pr-header {
      width: 100%;
      background: #183b56;
      color: #ffffff;
      text-align: center;
      padding: 20px 20px 18px;
    }

    .pr-header h1 {
      font-size: 38px;
      font-weight: 700;
    }

    .sub-nav {
      width: 100%;
      height: 58px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 55px;
      background: #ffffff;
      border-bottom: 1px solid #e5e5e5;
    }

    .sub-nav a {
      position: relative;
      display: flex;
      align-items: center;
      height: 58px;
      color: #333;
      font-size: 15px;
      font-weight: 500;
      text-decoration: none;
    }

    .sub-nav a:hover {
      color: #183b56;
    }

    .sub-nav a.active {
      color: #183b56;
      font-weight: 700;
    }

    .sub-nav a.active::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 3px;
      background: #183b56;
    }

    .content-section {
      width: 100%;
      padding: 55px 20px 90px;
    }

    .section-title {
      text-align: center;
      margin-bottom: 45px;
    }

    .section-title h2 {
      font-size: 34px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .section-title-line {
      width: 520px;
      max-width: 100%;
      height: 1px;
      margin: 0 auto;
      background: #dddddd;
    }

    .image-wrap {
  width: min(900px, 100%);
  margin: 0 auto;
  text-align: center;
}

.content-image {
  display: block;
  width: 100%;
  max-width: 900px;
  height: auto;
  margin: 0 auto;
}

    footer {
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #777;
      font-size: 12px;
    }

    @media (max-width: 768px) {

      header {
        height: 70px;
        padding: 0 20px;
      }

      .logo img {
        width: 145px;
      }

      .main-nav {
        gap: 13px;
      }

      .main-nav a {
        font-size: 11px;
      }

      .pr-header h1 {
        font-size: 29px;
      }

      .sub-nav {
        justify-content: flex-start;
        gap: 25px;
        padding: 0 15px;
        overflow-x: auto;
      }

      .sub-nav a {
        flex-shrink: 0;
        font-size: 12px;
      }

      .content-section {
        padding: 40px 10px 65px;
      }

      .section-title h2 {
        font-size: 28px;
      }

      .image-wrap {
        overflow-x: auto;
      }

      .content-image {
        width: 950px;
        max-width: none;
      }
    }

  </style>
</head>

<body>

  <header>

    <a class="logo" href="./">
      <img src="logo-horizontal.png" alt="인켈로재 로고">
    </a>

    <nav class="main-nav">
      <a href="company.html">회사소개</a>
      <a href="safety-certificate.html">안전경영</a>
      <a href="pr-certificate.html">홍보센터</a>
      <a href="contact.html">고객지원</a>
    </nav>

  </header>


  <section class="pr-header">
    <h1>홍보센터</h1>
  </section>


  <nav class="sub-nav">

    <a href="pr-certificate.html">
      인증서
    </a>

    <a href="projects.html" class="active">
      공사실적
    </a>

    <a href="equipment.html">
      장비보유현황
    </a>

    <a href="gallery.html">
      현장사진
    </a>

  </nav>


  <main>

    <section class="content-section">

      <div class="section-title">
        <h2>공사실적</h2>
        <div class="section-title-line"></div>
      </div>

      <div class="image-wrap">

        <img
          class="content-image"
          src="projects.png"
          alt="인켈로재 공사실적"
        >

      </div>

    </section>

  </main>


  <footer>
    © INKEL FURNACE. All Rights Reserved.
  </footer>

</body>
</html>
